<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris</title>
  <style>
    body { margin: 0; padding: 1rem; background: #111827; color: #f9fafb; font: 16px system-ui, sans-serif; text-align: center; }
    .language-picker { display: block; margin: .5rem; }
    .language-picker select { padding: .5rem; color: inherit; background: #334155; border: 1px solid #64748b; border-radius: .5rem; font: inherit; }
    h1 { margin: .5rem 0; }
    .game { position: relative; width: min(600px, 100%); aspect-ratio: 1; margin: auto; }
    canvas { width: 100%; height: 100%; display: block; }
    #text { position: absolute; inset: 0; pointer-events: none; }
    p { max-width: 600px; margin: 1rem auto; line-height: 1.5; }
    #status { color: #fbbf24; }
    fieldset { max-width: 600px; margin: 1rem auto; padding: 0; border: 0; }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    .controls button, #name-form button { min-height: 48px; border: 1px solid #64748b; border-radius: .6rem; background: #334155; color: white; font: inherit; cursor: pointer; touch-action: manipulation; user-select: none; }
    .controls button:active, #name-form button:active { background: #475569; }
    .controls button:focus-visible, #name-form :focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
    .controls .arrow { font-size: 1.5rem; }
    .controls .select { background: #166534; }
    #name-form { max-width: 600px; margin: 1rem auto; }
    #name-form label { display: block; margin-bottom: .5rem; }
    #name-form input { box-sizing: border-box; width: min(12rem, 60%); min-height: 48px; border: 1px solid #64748b; border-radius: .6rem; padding: .5rem; font: inherit; }
    #name-form button { padding: 0 1rem; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { body { padding: .5rem; } h1 { margin: .25rem 0; font-size: 1.4rem; } fieldset { margin: .5rem auto; } .controls { gap: .35rem; } p { margin: .6rem auto; } }
  </style>
</head>
<body>
  <h1>Tetris</h1>
  <label class="language-picker">PL / EN <select id="language" aria-label="Język / Language"><option value="pl">Polski</option><option value="en">English</option></select></label>
  <div class="game">
    <canvas id="canvas" width="600" height="600" tabindex="0" aria-label="Tetris game"></canvas>
    <canvas id="text" width="600" height="600" aria-hidden="true"></canvas>
  </div>
  <form id="name-form" hidden>
    <label for="player-name" data-i18n>High score! Enter your name (letters and numbers):</label>
    <input id="player-name" maxlength="11" autocomplete="off" autocapitalize="off">
    <button type="submit" data-i18n>Save score</button>
  </form>
  <fieldset id="controls" disabled aria-label="Game controls">
    <div class="controls">
      <button type="button" data-key="27" data-i18n>Back / Save</button>
      <button type="button" class="arrow" data-key="101" data-special="1" aria-label="Up or rotate">▲</button>
      <button type="button" data-key="112" data-i18n>Pause</button>
      <button type="button" class="arrow" data-key="100" data-special="1" data-repeat aria-label="Move left">◀</button>
      <button type="button" class="arrow" data-key="103" data-special="1" data-repeat aria-label="Move down">▼</button>
      <button type="button" class="arrow" data-key="102" data-special="1" data-repeat aria-label="Move right">▶</button>
      <button type="button" data-key="45" data-i18n>Faster</button>
      <button type="button" class="select" data-key="32" data-i18n>Select</button>
      <button type="button" data-key="43" data-i18n>Slower</button>
      <button type="button" data-key="1" data-special="1" data-i18n>Help</button>
      <button type="button" data-key="108" data-i18n>Language</button>
    </div>
  </fieldset>
  <p data-i18n>Use the buttons or arrow keys to move and rotate. Select starts a game; Back returns to the menu.</p>
  <p id="status" role="status" data-message="Loading game…">Loading game…</p>
  <script src="i18n.js"></script>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      preRun: [function () {
        try {
          const saved = localStorage.getItem('tetris-results');
          if (saved !== null) FS.writeFile('wyniki.txt', saved);
        } catch (error) { console.warn('Could not load results:', error); }
      }],
      onRuntimeInitialized: function () { document.getElementById('status').textContent = ''; delete document.getElementById('status').dataset.message; document.getElementById('controls').disabled = false; },
      onAbort: function () { document.getElementById('status').dataset.message = 'The game could not start. Please reload the page.'; document.getElementById('status').textContent = TetrisI18n.t('The game could not start. Please reload the page.'); }
    };
  </script>
  <script>
    // GLUT listens on window in capture phase; leave form and button keys to the browser.
    for (const type of ['keydown', 'keyup']) {
      window.addEventListener(type, function (event) {
        if (event.target.id === 'language' || event.target.id === 'player-name' ||
            (event.target.closest?.('#controls button') && (event.key === ' ' || event.key === 'Enter'))) {
          event.stopImmediatePropagation();
        }
      }, true);
    }
    const controls = document.getElementById('controls');
    const sendKey = button => Module._web_key(Number(button.dataset.key), Number(button.dataset.special || 0));
    for (const button of controls.querySelectorAll('button')) {
      let delay, repeat, pointerActivated = false;
      const stop = () => { clearTimeout(delay); clearInterval(repeat); };
      button.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        event.preventDefault();
        pointerActivated = true;
        button.setPointerCapture(event.pointerId);
        sendKey(button);
        if (button.hasAttribute('data-repeat')) {
          delay = setTimeout(() => { repeat = setInterval(() => sendKey(button), 100); }, 350);
        }
      });
      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) button.addEventListener(type, stop);
      button.addEventListener('pointerup', () => setTimeout(() => { pointerActivated = false; }, 0));
      button.addEventListener('pointercancel', () => { pointerActivated = false; });
      button.addEventListener('click', () => { if (!pointerActivated) sendKey(button); });
    }
    document.getElementById('name-form').addEventListener('submit', event => {
      event.preventDefault();
      const name = document.getElementById('player-name').value.replace(/[^a-zA-Z0-9]/g, '').slice(0, 11);
      Module._web_name_char(0, 1);
      for (const character of name) Module._web_name_char(character.charCodeAt(0), 0);
      Module._web_key(27, 0);
      document.getElementById('player-name').blur();
    });
  </script>
  <script src="tetris.js"></script>
</body>
</html>
