<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Classic Tetris in a vintage CRT monitor. Play with your keyboard or the touch mini pad, in English or Polish.">
  <meta name="theme-color" content="#171b18">
  <title>Tetris · CRT Arcade</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <main class="arcade">
    <section class="monitor" aria-label="Tetris monitor">
      <div class="glass">
        <div class="game">
          <canvas id="canvas" width="600" height="600" tabindex="0" aria-label="Tetris game"></canvas>
          <canvas id="text" width="600" height="600" aria-hidden="true"></canvas>
          <div class="boot" id="boot" role="status">
            <strong>TETRIS</strong>
            <span id="status" data-message="Loading game…">Loading game…</span>
            <button id="retry" type="button" data-i18n hidden>Try again</button>
          </div>
        </div>
      </div>
      <div class="chin">
        <h1 class="badge">TETRIS<span>COLOR CRT<br>EST. 2015</span></h1>
        <div class="vents" aria-hidden="true"></div>
        <div class="hardware">
          <span class="indicator" aria-hidden="true"><i id="led"></i>POWER</span>
          <button class="restart" id="restart" type="button" aria-label="Restart game">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v9M6.3 5.9a8 8 0 1 0 11.4 0"/></svg>
          </button>
        </div>
      </div>
    </section>
    <div class="stand" aria-hidden="true"></div>
    <section class="controller" aria-label="Mini pad">
      <div class="controller-heading"><span>MINI PAD</span><span data-i18n>KEYBOARD / TOUCH</span></div>
      <fieldset id="controls" disabled aria-label="Game controls">
        <div class="dpad">
          <button type="button" class="up" data-key="101" data-special="1" aria-label="Up or rotate">▲</button>
          <button type="button" class="left" data-key="100" data-special="1" data-repeat aria-label="Move left">◀</button>
          <span class="dpad-center" aria-hidden="true"></span>
          <button type="button" class="down" data-key="103" data-special="1" data-repeat aria-label="Move down">▼</button>
          <button type="button" class="right" data-key="102" data-special="1" data-repeat aria-label="Move right">▶</button>
        </div>
        <div class="actions">
          <button type="button" class="select" data-key="32" aria-label="Select"><span data-i18n>Select</span><small>SPACE</small></button>
          <button type="button" data-key="112" aria-label="Pause"><span data-i18n>Pause</span><small>P</small></button>
          <button type="button" data-key="27" aria-label="Back / Save"><span data-i18n>Back / Save</span><small>ESC</small></button>
          <button type="button" data-key="1" aria-label="Help" data-special="1"><span data-i18n>Help</span><small>F1</small></button>
          <button type="button" data-key="45" aria-label="Faster"><span data-i18n>Faster</span><small>−</small></button>
          <button type="button" data-key="43" aria-label="Slower"><span data-i18n>Slower</span><small>+</small></button>
        </div>
      </fieldset>
      <p data-i18n>Use the buttons or arrow keys to move and rotate. Select starts a game; Back returns to the menu.</p>
      <form id="name-form" hidden>
        <label for="player-name" data-i18n>High score! Enter your name (letters and numbers):</label>
        <div class="name-entry">
          <input id="player-name" maxlength="11" autocomplete="off" autocapitalize="off" aria-describedby="name-hint">
          <button type="submit" data-i18n>Save score</button>
        </div>
        <p id="name-hint" data-i18n>Scores are saved on this device.</p>
      </form>
    </section>
    <footer>
      <a href="https://adam-zielonka.github.io/" data-i18n>← Portfolio</a>
      <a href="https://github.com/adam-zielonka/tetris" data-i18n>Source code</a>
      <div class="language-switch" role="group" aria-label="Language / Język">
        <button type="button" lang="en" data-language="en" aria-pressed="false">English</button>
        <span aria-hidden="true">/</span>
        <button type="button" lang="pl" data-language="pl" aria-pressed="false">Polski</button>
      </div>
    </footer>
    <noscript>Enable JavaScript to play Tetris. / Włącz JavaScript, aby zagrać w Tetrisa.</noscript>
  </main>
  <script src="i18n.js"></script>
  <script src="player.js"></script>
  <script src="tetris.js" onerror="Module.onAbort()"></script>
</body>
</html>
